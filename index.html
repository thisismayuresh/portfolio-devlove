<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>devlove — visual web builder</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/shell.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Cpath d='M10 22V10h9M10 16h7' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      Shell frame. Every panel is a custom element that owns its Shadow DOM.
      Each slot is a grid container (see css/shell.css) so the panel hosts are
      stretched grid items with a real height.
    -->
    <div
      class="shell"
      id="shell"
      data-mode="design"
      data-left-sidebar="open"
      data-right-sidebar="open"
      hidden
    >
      <dl-toolbar class="shell__topbar"></dl-toolbar>

      <dl-rail class="shell__rail"></dl-rail>

      <div class="shell__left" id="left-dock">
        <dl-palette data-panel="elements"></dl-palette>
        <dl-layers data-panel="layers" hidden></dl-layers>
        <dl-templates data-panel="templates" hidden></dl-templates>
        <dl-problems data-panel="problems" hidden></dl-problems>
        <dl-find data-panel="find" hidden></dl-find>
        <dl-assets data-panel="assets" hidden></dl-assets>
        <dl-theme data-panel="theme" hidden></dl-theme>
      </div>

      <div class="shell__stage">
        <dl-canvas></dl-canvas>
      </div>

      <div class="shell__right">
        <dl-inspector></dl-inspector>
      </div>

      <dl-status class="shell__status"></dl-status>
    </div>

    <!-- Keyboard help. A fixed overlay, so it sits outside the shell grid. -->
    <dl-help data-open="false"></dl-help>

    <!-- First-run welcome. A fixed notification, likewise outside the grid. -->
    <dl-welcome data-open="false"></dl-welcome>

    <!-- Canvas context menu. Fixed, outside the grid, items come from the canvas. -->
    <dl-context-menu data-open="false"></dl-context-menu>

    <!-- Command palette (Ctrl+K). Fixed above every other overlay. -->
    <dl-commands data-open="false"></dl-commands>

    <!-- Boot gate: shown until the engine reports ready, or the failure. -->
    <div class="boot" id="boot">
      <div class="boot__inner">
        <div class="boot__mark"></div>
        <h1 class="boot__title">Starting devlove</h1>
        <p class="boot__note" id="boot-note">Loading the editor…</p>
        <div class="boot__bar"></div>
        <pre class="boot__error" id="boot-error"></pre>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <noscript>
      <p style="padding: 24px; color: #d7dae1">This editor needs JavaScript enabled.</p>
    </noscript>
  </body>
</html>
