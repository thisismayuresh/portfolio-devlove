[package]
name = "designer_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance WASM core for a zero-dependency drag-and-drop website builder"
license = "MIT"
repository = ""

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm-opt settings used by wasm-pack.
#
# Rust 1.82+ emits bulk-memory and non-trapping float-to-int instructions for
# wasm32 by default. The `wasm-opt` binary wasm-pack downloads validates with
# those features off, so it must be told to accept them explicitly — otherwise
# the build fails with "Bulk memory operations require bulk memory".
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
]

# Dev builds skip wasm-opt entirely: the point of `--dev` is a fast rebuild.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

# Release profile tuned for a small, fast .wasm payload.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
