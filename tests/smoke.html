<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forge smoke test</title>
    <style>
      body { background: #111; color: #ddd; font: 13px/1.6 monospace; padding: 16px; }
      .pass { color: #4ade80; }
      .fail { color: #f87171; }
    </style>
  </head>
  <body>
    <h1 id="verdict">running…</h1>
    <pre id="out"></pre>

    <!--
      Headless end-to-end check of the engine ↔ preview-frame contract.

          python serve.py
          chrome --headless=new --dump-dom --virtual-time-budget=10000 \
                 http://127.0.0.1:8080/tests/smoke.html

      Every result is written into #out as plain text so `--dump-dom` captures
      it. Nothing here touches the editor UI — this covers the layer beneath it.
    -->
    <script type="module">
      import init, { createEngine, availableKinds } from '../pkg/designer_engine.js';

      const results = [];
      const check = (name, condition, detail = '') => {
        results.push(`${condition ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`);
        // Stream to the DOM so `--dump-dom` still captures progress if a later
        // step never settles.
        document.getElementById('out').textContent = results.join('\n');
        return Boolean(condition);
      };

      /**
       * Resolves with the first `rects` message the frame posts.
       *
       * Deliberately has no timeout. Headless Chrome runs this under a virtual
       * clock that can jump the entire time budget the instant the WASM fetch
       * settles, so any competing timer would always win the race and report a
       * failure that does not exist in a real browser.
       */
      function waitForRects(frame, predicate) {
        return waitForFrameMessage(frame, 'rects', predicate);
      }

      /**
       * @param {HTMLIFrameElement} frame
       * @param {string} type
       * @param {(data: any) => boolean} [predicate] ignore messages that fail it
       */
      function waitForFrameMessage(frame, type, predicate) {
        return new Promise((resolve) => {
          function onMessage(event) {
            const data = event.data;
            if (!data || data.source !== 'tb-frame' || data.type !== type) {
              return;
            }
            if (event.source !== frame.contentWindow) {
              return;
            }
            // A measurement may already be in flight when we start listening,
            // so callers can insist on the state they are actually waiting for.
            if (predicate && !predicate(data)) {
              return;
            }
            window.removeEventListener('message', onMessage);
            resolve(data);
          }
          window.addEventListener('message', onMessage);
        });
      }

      async function run() {
        await init();

        const engine = createEngine();
        check('engine instantiates', Boolean(engine));
        check('availableKinds returns JSON', JSON.parse(availableKinds()).length > 0);

        // --- structural API -------------------------------------------------
        const box = engine.addElement('container', 'root', 40, 60);
        check('addElement returns an id', typeof box === 'string' && box.length > 0, box);
        engine.updateElement(box, 'width', '300');
        engine.updateElement(box, 'height', '200');

        const label = engine.addElement('heading', box, 20, 20);
        check('nested addElement', typeof label === 'string', label);

        const node = JSON.parse(engine.getElement(label));
        check('child records its parent', node.parent === box, String(node.parent));

        const tree = JSON.parse(engine.getTree());
        check('tree root has one child', tree.children.length === 1, String(tree.children.length));

        // --- compiler -------------------------------------------------------
        const preview = engine.compilePreview();
        check('preview carries data-nid', preview.includes(`data-nid="${box}"`));
        check('preview carries the runtime', preview.includes('tb-frame'));
        check('export carries no runtime', !engine.compileExport().includes('<script>'));

        // --- the frame handshake -------------------------------------------
        // Must stay on-screen: Chrome does not run requestAnimationFrame for
        // an off-screen frame, and the measurement runtime is rAF-driven.
        const frame = document.createElement('iframe');
        frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
        frame.style.cssText = 'width:1280px;height:900px;border:1px solid #333';
        document.body.append(frame);

        const ready = waitForFrameMessage(frame, 'ready');
        const pending = waitForRects(frame);
        frame.srcdoc = preview;

        await ready;
        check('frame runtime boots', true);

        const rects = (await pending).rects;
        check('frame posts rects', true);

        if (rects) {
          check('rects include the root', Array.isArray(rects.root), JSON.stringify(rects.root));
          check('rects include the box', Array.isArray(rects[box]), JSON.stringify(rects[box]));

          engine.syncRects(JSON.stringify(rects));

          const boxRect = rects[box] || [0, 0, 0, 0];
          const cx = boxRect[0] + boxRect[2] / 2;
          const cy = boxRect[1] + boxRect[3] / 2;

          check('hitTest finds a node at the box centre', engine.hitTest(cx, cy) !== undefined);
          const hit = engine.hitTest(cx, cy);
          check('hitTest resolves inside the box', hit === box || hit === label, String(hit));
          check('hitTest misses empty space', !engine.hitTest(1270, 890), String(engine.hitTest(1270, 890)));
          check('dropTarget returns the box', engine.dropTarget(cx, cy) === box, String(engine.dropTarget(cx, cy)));
          check(
            'dropTarget excludes the dragged subtree',
            engine.dropTarget(cx, cy, box) === 'root',
            String(engine.dropTarget(cx, cy, box))
          );

          const local = JSON.parse(engine.toLocalPoint(box, cx, cy));
          check('toLocalPoint is inside the box', local[0] > 0 && local[0] < 300, JSON.stringify(local));

          // --- the live-patch path -----------------------------------------
          const before = rects[box][0];
          engine.moveElement(box, 500, 60);
          const css = engine.nodeCss(box);
          check('nodeCss emits absolute geometry', css.includes('left:500px'), css.slice(0, 90));

          const patched = waitForRects(frame, (data) => {
            const box_ = data.rects[box];
            return Array.isArray(box_) && box_[0] !== before;
          });
          frame.contentWindow.postMessage({ target: 'tb-frame', type: 'patch', id: box, css }, '*');
          const moved = (await patched).rects[box];
          check('patch moves the element in the frame', moved && moved[0] !== before, JSON.stringify(moved));
        }

        // --- history --------------------------------------------------------
        engine.clearHistory();
        engine.deleteElement(box);
        check('delete removes the subtree', engine.nodeCount() === 1, String(engine.nodeCount()));
        check('undo restores it', engine.undo() && engine.nodeCount() === 3, String(engine.nodeCount()));

        const failures = results.filter((line) => line.startsWith('FAIL'));
        document.getElementById('out').textContent = results.join('\n');
        document.getElementById('verdict').textContent =
          failures.length === 0 ? `ALL ${results.length} CHECKS PASSED` : `${failures.length} FAILED`;
        document.title = failures.length === 0 ? 'SMOKE-OK' : 'SMOKE-FAIL';
      }

      run().catch((error) => {
        document.getElementById('verdict').textContent = 'HARNESS ERROR';
        document.getElementById('out').textContent = String(error && error.stack ? error.stack : error);
        document.title = 'SMOKE-FAIL';
      });
    </script>
  </body>
</html>
